name: Checks

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.14'

      - name: Install the app with its development tools
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check the formatting
        run: uv run ruff format --check

      - name: Check the types
        run: uv run mypy

      - name: Test
        run: uv run pytest
