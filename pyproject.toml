[project]
name = "northlighttools"
version = "2.0.0"
description = "Collection of various tools for Northlight Engine used for Polish fan translation of Quantum Break!"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "translate-toolkit>=3.20.0",
    "rich>=15.0.0",
    "lxml>=6.1.3",
]

[project.scripts]
northlighttools = "northlighttools.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-lxml>=2026.2.16",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF", "D"]
# Modules, packages, types and magic methods carry a summary only where their name needs one
ignore = ["D100", "D101", "D104", "D105", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "games: round trips over the games' own files, in the folders NORTHLIGHT_GAME_DIRS lists",
]

[tool.mypy]
files = ["src", "tests"]
strict = true
# translate-toolkit is only partly typed
untyped_calls_exclude = ["translate"]
