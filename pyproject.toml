[project]
name = "northlighttools"
version = "1.3.0"
description = "Collection of various tools for Northlight Engine used for Polish fan translation of Quantum Break!"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.3",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "humanize>=4.16.0",
    "translate-toolkit>=3.20.0",
]

[project.scripts]
northlighttools = "northlighttools:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
files = ["src", "tests"]
strict = true
